<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">
    <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 

        /* Right Sidebar */
        #sidebar {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 340px;
            background: rgba(255, 255, 255, 0.98);
            border-left: 2px solid #ccc;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        /* Layer Switcher inside sidebar */
        .ol-control.ol-layerswitcher {
            position: relative !important;
            right: auto !important;
            left: auto !important;
            top: auto !important;
            margin: 10px;
        }

        /* Attribute Info Panel */
        #attribute-panel {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 13px;
            border-top: 1px solid #ccc;
        }
        #attribute-panel h4 {
            margin: 0 0 8px 0;
            font-size: 15px;
            font-weight: bold;
        }
        #feature-info table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 5px;
        }
        #feature-info th, #feature-info td {
            border: 1px solid #ccc;
            padding: 4px;
            text-align: left;
        }
        #feature-info th {
            background-color: #f0f0f0;
        }

        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Optional Toggle Buttons (Left Side) */
        #layer-buttons {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1100;
            background: rgba(255,255,255,0.95);
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
            max-width: 250px;
        }
        #layer-buttons h4 {
            margin: 0 0 5px 0;
            font-size: 14px;
        }
        #layer-buttons button {
            display: block;
            margin: 2px 0;
            width: 120px;
            cursor: pointer;
        }
    </style>
    <title>GIS Map</title>
</head>
<body>
    <div id="map"></div>

    <!-- Right Sidebar -->
    <div id="sidebar">
        <!-- Layer Switcher -->
        <div id="layer-switcher-container"></div>

        <!-- Attribute Info Panel -->
        <div id="attribute-panel">
            <h4>Selected Feature Attributes</h4>
            <div id="feature-info">
                <p>Click on a feature to see details</p>
            </div>
        </div>
    </div>

    <!-- Optional Layer Toggle Buttons -->
    <div id="layer-buttons">
        <h4>Toggle Layers</h4>
        <button onclick="toggleLayer('buildings')">Buildings</button>
        <button onclick="toggleLayer('road')">Road</button>
        <button onclick="toggleLayer('vegetation')">Vegetation</button>
        <button onclick="toggleLayer('waterbody')">Waterbody</button>
        <button onclick="toggleLayer('siteBoundary')">Site Boundary</button>
    </div>

    <!-- JS Libraries -->
    <script src="resources/qgis2web_expressions.js"></script>
    <script src="resources/proj4.js"></script>
    <script>
        proj4.defs('EPSG:3857','+proj=merc +a=6378137 +b=6378137 +lat_ts=0 +lon_0=0 +x_0=0 +y_0=0 +k=1 +units=m +nadgrids=@null +wktext +no_defs');
    </script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js"></script>

    <!-- Layers -->
    <script src="layers/buildings_150725_1.js"></script>
    <script src="layers/road_050825_2.js"></script>
    <script src="layers/vegetation_150725_3.js"></script>
    <script src="layers/waterbody_220725_4.js"></script>
    <script src="layers/site2_boundary_5.js"></script>

    <!-- Styles -->
    <script src="styles/buildings_150725_1_style.js"></script>
    <script src="styles/road_050825_2_style.js"></script>
    <script src="styles/vegetation_150725_3_style.js"></script>
    <script src="styles/waterbody_220725_4_style.js"></script>
    <script src="styles/site2_boundary_5_style.js"></script>

    <!-- Layer list -->
    <script src="./layers/layers.js" type="text/javascript"></script> 
    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>

    <script>
        // Add Layer Switcher inside sidebar
        window.onload = function() {
            if (typeof map !== 'undefined') {
                var layerSwitcher = new ol.control.LayerSwitcher({
                    activationMode: 'click',
                    startActive: true,
                    tipLabel: 'Layers',
                    groupSelectStyle: 'children',
                    collapseTipLabel: 'Collapse',
                    target: document.getElementById('layer-switcher-container')
                });
                map.addControl(layerSwitcher);
            } else {
                console.error("Map object not found. Check qgis2web.js");
            }
        }

        // Layer toggle references
        var layerRefs = {
            'buildings': buildings_150725_1,
            'road': road_050825_2,
            'vegetation': vegetation_150725_3,
            'waterbody': waterbody_220725_4,
            'siteBoundary': site2_boundary_5
        };

        function toggleLayer(layerName) {
            var layer = layerRefs[layerName];
            if (layer) {
                layer.setVisible(!layer.getVisible());
            }
        }

        // Highlight selected feature
        var highlightLayer = new ol.layer.Vector({
            source: new ol.source.Vector(),
            style: new ol.style.Style({
                stroke: new ol.style.Stroke({ color: '#ff0000', width: 2 }),
                fill: new ol.style.Fill({ color: 'rgba(255,0,0,0.1)' })
            })
        });
        map.addLayer(highlightLayer);

        // Click event to show attributes
        map.on('singleclick', function(evt) {
            var infoDiv = document.getElementById('feature-info');
            infoDiv.innerHTML = '';
            highlightLayer.getSource().clear();

            var featureFound = false;
            map.forEachFeatureAtPixel(evt.pixel, function(feature, layer) {
                featureFound = true;

                // Highlight geometry
                var geomFeature = new ol.Feature({ geometry: feature.getGeometry().clone() });
                highlightLayer.getSource().addFeature(geomFeature);

                // Attribute table
                var attributes = feature.getProperties();
                var table = '<table><tr><th>Attribute</th><th>Value</th></tr>';
                for (var key in attributes) {
                    if (key !== 'geometry') {
                        table += '<tr><td>' + key + '</td><td>' + attributes[key] + '</td></tr>';
                    }
                }
                table += '</table>';
                infoDiv.innerHTML += table;
            });

            if (!featureFound) {
                infoDiv.innerHTML = '<p>No feature selected</p>';
            }
        });
    </script>
</body>
</html>

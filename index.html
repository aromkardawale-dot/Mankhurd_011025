<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- OpenLayers CSS -->
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">

    <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, 
        .gcd-gl-input::placeholder, 
        .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, 
        .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }

        /* Fullscreen map */
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        /* Right-side layer switcher */
        .layer-switcher {
            right: 10px;
            left: auto;
            top: 70px;
        }
    </style>

    <title>OpenLayers Map with Layer Panel</title>
</head>
<body>
    <div id="map">
        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>
    </div>

    <!-- Required JS -->
    <script src="resources/qgis2web_expressions.js"></script>
    <script src="resources/proj4.js"></script>
    <script>
        proj4.defs('EPSG:3857','+proj=merc +a=6378137 +b=6378137 +lat_ts=0 +lon_0=0 +x_0=0 +y_0=0 +k=1 +units=m +nadgrids=@null +wktext +no_defs');
    </script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js"></script>

    <!-- Layers -->
    <script src="layers/1m_contours_1.js"></script>
    <script src="layers/buildings_150725_2.js"></script>
    <script src="layers/road_050825_3.js"></script>
    <script src="layers/vegetation_150725_4.js"></script>
    <script src="layers/waterbody_220725_5.js"></script>
    <script src="layers/site2_boundary_6.js"></script>

    <!-- Styles -->
    <script src="styles/1m_contours_1_style.js"></script>
    <script src="styles/buildings_150725_2_style.js"></script>
    <script src="styles/road_050825_3_style.js"></script>
    <script src="styles/vegetation_150725_4_style.js"></script>
    <script src="styles/waterbody_220725_5_style.js"></script>
    <script src="styles/site2_boundary_6_style.js"></script>

    <!-- Layer List -->
    <script src="./layers/layers.js" type="text/javascript"></script> 
    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>

    <script>
        // Wait for qgis2web map to load
        document.addEventListener("DOMContentLoaded", function() {
            // Create layer switcher
            var layerSwitcher = new ol.control.LayerSwitcher({
                activationMode: 'click',  // expand on click
                startActive: true,        // expanded by default
                tipLabel: 'Layers',       // tooltip
                groupSelectStyle: 'children' // checkbox style
            });

            // Add to map (map is created in qgis2web.js)
            map.addControl(layerSwitcher);
        });
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- OpenLayers CSS -->
  <link rel="stylesheet" href="./resources/ol.css">
  <link rel="stylesheet" href="resources/fontawesome-all.min.css">
  <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
  <link rel="stylesheet" href="./resources/qgis2web.css">

  <style>
    html, body {
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Unified Sidebar Panel */
    #info-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 320px;
      height: 100%;
      background: #f9f9f9;
      border-right: 1px solid #ccc;
      box-shadow: 2px 0 6px rgba(0,0,0,0.15);
      padding: 15px;
      font-size: 14px;
      z-index: 9999;
      overflow-y: auto;
      transition: all 0.3s ease;
    }

    #info-panel h3 {
      margin: 16px 0 8px 0;
      font-size: 16px;
      color: #222;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }

    #info-panel label {
      display: block;
      margin-top: 8px;
      font-weight: 600;
      color: #333;
    }

    #info-panel select, 
    #info-panel button {
      width: 100%;
      margin-top: 6px;
      padding: 6px;
      font-size: 14px;
      border: 1px solid #aaa;
      border-radius: 4px;
      box-sizing: border-box;
    }

    #info-panel button {
      background-color: #444;
      color: white;
      cursor: pointer;
    }

    #info-panel button:hover {
      background-color: #666;
    }

    .layer-switcher {
      position: relative !important;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-top: 10px;
    }

    /* Feature info list */
    #attribute-content ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #attribute-content li {
      margin: 2px 0;
      font-size: 13px;
    }

    /* Toggle button */
    #toggle-panel {
      position: absolute;
      top: 10px;
      left: 330px;
      z-index: 10000;
      background: #444;
      color: white;
      padding: 6px 12px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    #toggle-panel:hover {
      background: #666;
    }

    /* When panel hidden */
    .collapsed {
      transform: translateX(-330px);
    }
  </style>

  <title>Unified Map Info Panel</title>
</head>
<body>
  <button id="toggle-panel">Hide Panel</button>
  <div id="map"></div>

  <!-- ONE Combined Vertical Panel -->
  <div id="info-panel">
    <!-- Layers -->
    <div id="layerSection">
      <h3>Layers</h3>
    </div>

    <!-- Map Controls -->
    <div id="mapControls">
      <h3>Map Controls</h3>
      <label for="layerSelect">Select layer</label>
      <select id="layerSelect">
        <option value="Buildings">Buildings</option>
        <option value="Roads">Roads</option>
        <option value="Vegetation">Vegetation</option>
      </select>

      <label for="attributeSelect">Select attribute</label>
      <select id="attributeSelect">
        <option value="bldg_use">bldg_use</option>
        <option value="height">height</option>
        <option value="type">type</option>
      </select>

      <button id="resetStyle">Reset styling</button>
    </div>

    <!-- Feature Info -->
    <div id="featureInfo">
      <h3>Feature Info</h3>
      <div id="attribute-content">No feature clicked</div>
    </div>
  </div>

  <!-- JS -->
  <script src="resources/qgis2web_expressions.js"></script>
  <script src="resources/proj4.js"></script>
  <script>
    proj4.defs('EPSG:3857','+proj=merc +a=6378137 +b=6378137 +lat_ts=0 +lon_0=0 +x_0=0 +y_0=0 +k=1 +units=m +nadgrids=@null +wktext +no_defs');
  </script>
  <script src="./resources/functions.js"></script>
  <script src="./resources/ol.js"></script>
  <script src="./resources/ol-layerswitcher.js"></script>
  <script src="resources/photon-geocoder-autocomplete.min.js"></script>

  <!-- Layers -->
  <script src="layers/1m_contours_1.js"></script>
  <script src="layers/buildings_150725_2.js"></script>
  <script src="layers/road_050825_3.js"></script>
  <script src="layers/vegetation_150725_4.js"></script>
  <script src="layers/waterbody_220725_5.js"></script>
  <script src="layers/site2_boundary_6.js"></script>

  <!-- Styles -->
  <script src="styles/1m_contours_1_style.js"></script>
  <script src="styles/buildings_150725_2_style.js"></script>
  <script src="styles/road_050825_3_style.js"></script>
  <script src="styles/vegetation_150725_4_style.js"></script>
  <script src="styles/waterbody_220725_5_style.js"></script>
  <script src="styles/site2_boundary_6_style.js"></script>

  <!-- Layer list -->
  <script src="./layers/layers.js" type="text/javascript"></script>
  <script src="./resources/Autolinker.min.js"></script>
  <script src="./resources/qgis2web.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Add layer switcher control
      var layerSwitcher = new ol.control.LayerSwitcher({
        activationMode: 'click',
        startActive: true,
        tipLabel: 'Layers',
        groupSelectStyle: 'children'
      });
      map.addControl(layerSwitcher);

      // Move layer switcher into the panel
      const ls = document.querySelector('.layer-switcher');
      document.getElementById('layerSection').appendChild(ls);

      // Toggle panel visibility
      const panel = document.getElementById("info-panel");
      const toggleBtn = document.getElementById("toggle-panel");

      toggleBtn.addEventListener("click", function() {
        if (panel.classList.contains("collapsed")) {
          panel.classList.remove("collapsed");
          toggleBtn.style.left = "330px";
          toggleBtn.textContent = "Hide Panel";
        } else {
          panel.classList.add("collapsed");
          toggleBtn.style.left = "10px";
          toggleBtn.textContent = "Show Panel";
        }
      });

      // Feature info click
      map.on("singleclick", function(evt) {
        const content = document.getElementById("attribute-content");
        content.innerHTML = "No feature clicked";

        map.forEachFeatureAtPixel(evt.pixel, function(feature, layer) {
          if (feature) {
            let props = feature.getProperties();
            let html = "<ul>";
            for (let key in props) {
              if (key !== "geometry") {
                html += "<li><b>" + key + ":</b> " + props[key] + "</li>";
              }
            }
            html += "</ul>";
            content.innerHTML = html;
          }
        });
      });

      // Reset styling button
      document.getElementById("resetStyle").addEventListener("click", function() {
        alert("Reset styling function here");
      });
    });
  </script>
</body>
</html>
